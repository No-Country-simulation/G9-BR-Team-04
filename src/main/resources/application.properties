spring.application.name=techmind

# URL atualizada com a sua PDB local
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password= Senha123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect.oracle.prefer_long_raw=true

# Logging: reduzir verbosidade
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Upload de arquivos (endpoint /conteudo/lote) - deve bater com o limite do ValidatorCsv
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,prometheus,metrics,logfile
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
logging.file.name=logs/techmind.log
techmind.classificador.base-url=http://localhost:8000

# Virtual Threads
spring.threads.virtual.enabled=true