spring.application.name=techmind

# URL atualizada com a sua PDB local
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=Senha123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect.oracle.prefer_long_raw=true

# Logging: reduzir verbosidade
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Upload de arquivos (endpoint /conteudo/lote) - deve bater com o limite do ValidatorCsv
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator e Observabilidade (incluindo endpoints de resiliencia)
management.endpoints.web.exposure.include=health,info,prometheus,metrics,logfile,circuitbreakers,retries,bulkheads
management.health.circuitbreakers.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

logging.file.name=logs/techmind.log
techmind.classificador.api-key=dev-key-troque-em-producao
techmind.classificador.base-url=http://localhost:8000

# Virtual Threads
spring.threads.virtual.enabled=true

# ===== Resilience4j - Circuit Breaker =====
resilience4j.circuitbreaker.instances.classificador.sliding-window-size=10
resilience4j.circuitbreaker.instances.classificador.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.classificador.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.classificador.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.classificador.record-exceptions=com.g9team04.techmind.infrastructure.MlClassificacaoException

# ===== Resilience4j - Retry =====
resilience4j.retry.instances.classificador.max-attempts=3
resilience4j.retry.instances.classificador.wait-duration=500ms
resilience4j.retry.instances.classificador.retry-exceptions=org.springframework.web.client.ResourceAccessException

# ===== Resilience4j - Bulkhead =====
resilience4j.bulkhead.instances.classificador.max-concurrent-calls=20
resilience4j.bulkhead.instances.classificador.max-wait-duration=0