@if (tabs().length) {

<div class="w-full max-w-4xl mx-auto overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="flex border-b border-slate-200 bg-slate-50" role="tablist" aria-label="Tabs de navegação">

    @for (tab of tabs(); track tab.id) {
    <button type="button" role="tab" [attr.aria-selected]="activeTab() === tab.id" [disabled]="tab.disabled"
      class="flex items-center gap-2 border-b-2 px-5 py-3 text-sm font-medium transition-colors"
      [class.border-primary]="activeTab() === tab.id" [class.border-transparent]="activeTab() !== tab.id"
      [class.text-primary]="activeTab() === tab.id" [class.text-slate-500]="activeTab() !== tab.id"
      [class.cursor-not-allowed]="tab.disabled" [class.opacity-50]="tab.disabled" (click)="selectTab(tab.id)">
      @if (tab.icon) {
      <span [class]="tab.icon"></span>
      }
      {{ tab.label }}
    </button>
    }
  </div>

  <div class="p-6">
    @if (selectedTab(); as selected) {
    @if (selected.template) {
    <ng-container [ngTemplateOutlet]="selected.template"></ng-container>
    } @else if (selected.content) {
    <div class="text-slate-700">{{ selected.content }}</div>
    } @else {
    <div class="text-sm text-slate-500">
      Conteúdo desta aba não foi definido.
    </div>
    }
    }
  </div>
</div>

}
