<main class="">

  <div class="mb-8">
    <h1>Análise de Processamento de IA</h1>
    <h2>Monitoramento em tempo real de fluxos cognitivos e extração de dados</h2>
  </div>

  <div class="grid-3-responsive">
    <app-card titleCard="Índice de Conhecimento">
      <div class="space-y-3">
        <div class="h-60 w-full">
          <canvas baseChart type="line" [data]="knowledgeGrowthData" [options]="lineChartOptions">
          </canvas>
        </div>
        <div class="flex flex-wrap gap-2 items-center text-sm text-slate-600">
          <p class="font-semibold text-slate-900">
            {{ knowledgeTotal }} Notas
          </p>
          <span class="text-slate-400">|</span>
          <p>{{ peopleActives }} contribuintes ativos</p>
        </div>
      </div>
    </app-card>

    <app-card titleCard="Engajamento da Equipe">
      <div class="space-y-3">
        <div class="h-60 w-full">
          <canvas baseChart type="bar" [data]="engagementTeamData" [options]="barChartConfig">
          </canvas>
        </div>
        <div class="flex flex-wrap gap-2 items-center text-sm text-slate-600">
          <p class="font-semibold text-slate-900">
            {{ engagementTotal }} interações
          </p>
          <span class="text-slate-400">|</span>
          <p>{{ engagementPercent }}% contribuintes ativos</p>
        </div>
      </div>
    </app-card>

    <div class="flex flex-col gap-4">
      <app-card titleCard="Top 3 Contribuidores">
        <div class="flex justify-center items-center sm:gap-4 gap-6 flex-wrap">
          <div *ngFor="let contributor of topContributors" class=" ">
            <app-user-avatar contributorName="{{ contributor.name }}" />
          </div>

          <div class="flex flex-wrap w-full justify-center items-center">
            <a routerLink="#" class="text-sm text-shadow-2xs hover:text-primary/60 my-3.5">
              Veja outros »
            </a>
          </div>
        </div>
      </app-card>

      <app-card titleCard="Atalhos de Navegação">
        <div class="flex flex-wrap gap-3 justify-center items-center">
          <a *ngFor="let shortcut of shortcuts" routerLink="{{ shortcut.link }}"
            class="mt-2.5 px-2 py-1 border rounded-4xl text-sm text-slate-600 hover:text-primary/60 hover:border-primary/60 transition-all duration-300">
            {{ shortcut.label }}
          </a>
        </div>
      </app-card>
    </div>
  </div>

  <div class="grid-2-responsive">
    <app-card titleCard="Contribuições ao Longo dos Meses">
      <div class="space-y-3">
        <div class="h-60 w-full">
          <canvas baseChart type="line" [data]="contributionOverTimeData" [options]="lineChartOptions">
          </canvas>
        </div>
      </div>
    </app-card>
    <app-card titleCard="Tópicos Técnicos em Alta">
      <app-word-cloud [words]="wordFrequency()" />
    </app-card>
  </div>

  <div class="grid-1-responsive">
    <app-card titleCard="Contribuições Recentes">
      <div *ngFor="let contrib of recentContributions" class="">
        <app-list-view titleContent="{{contrib.title}}" author="{{contrib.author}}" createdAt="{{contrib.time}}" />
      </div>
    </app-card>
  </div>

</main>
