<div class="fixed w-screen">
    <app-header />
</div>

<main class="main-content min-h-screen place-content-center">

    <app-tabs [tabs]="tabs" class="md:mt-10" />

    <ng-template #dadosTpl>
        <form (ngSubmit)="onSubmit()" class="forms-block max-w-3xl mx-auto">
            <label>Título</label>
            <input type="text" name="titulo" [(ngModel)]="titulo" class="w-full border rounded-md p-2 mb-3" maxlength="50" />

            <label>Conteúdo</label>
            <textarea name="texto" [(ngModel)]="texto" rows="8" class="w-full border rounded-md p-2 mb-3" maxlength="1000"></textarea>

            <div class="flex items-center gap-3">
                <button type="submit" class="px-4 py-2 rounded-md text-white bg-primary hover:bg-primary/70">
                    Classificar e Publicar
                </button>
                @if (errorMsg()) {
                <div class="text-red-600">
                    {{ errorMsg() }}
                </div>
                }
            </div>
        </form>
    </ng-template>

    <ng-template #csvTpl>
        <div class="max-w-3xl mx-auto">
            <label class="block w-full">
                <input type="file" accept=".csv" (change)="onFileSelected($event)" hidden #fileInput />

                <div class="w-full border-2 border-dashed rounded p-8 text-center cursor-pointer"
                    (click)="fileInput.click()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
                    (drop)="onDrop($event)"
                    [style.borderColor]="dragOver() ? 'var(--color-primary)' : 'rgba(148,163,184,0.5)'">
                    <p class="text-slate-600">
                        Arraste e solte um arquivo CSV aqui, ou clique para selecionar
                    </p>
                    <p *ngIf="selectedFile" class="mt-2 font-medium">
                        Arquivo: {{ selectedFile?.name }}
                    </p>
                </div>
            </label>

            <div class="mt-4 flex items-center gap-3">
                <button (click)="uploadCsv()" class="px-4 py-2 rounded-md text-white bg-primary hover:bg-primary/70"
                    [disabled]="saving()">
                    {{ saving() ? 'Enviando...' : 'Enviar CSV' }}
                </button>
                @if(errorMsg()) {
                <div class="text-red-600">
                    {{ errorMsg() }}
                </div>
                }
            </div>
        </div>
    </ng-template>

</main>
