<div class="fixed w-screen">

</div>

<main class="flex flex-col px-4 h-screen place-content-center">

        <div class="flex justify-center">
            <svg data-p-icon="rectangle-xmark" [size]="96"></svg>
        </div>

        <h1 class="text-4xl font-bold text-center my-8">
