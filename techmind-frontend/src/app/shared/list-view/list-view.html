<div class="flex flex-row gap-2 p-4 border-b border-gray-100">

  <div class="flex flex-row flex-1 items-center
              max-sm:flex-col max-sm:items-start max-sm:gap-1">

    <div class="flex items-center gap-1.5 max-sm:w-full">
      <svg data-p-icon="file" [size]="24"></svg>
      <p class="font-bold text-1xl">
        {{ titleContent() }}
      </p>
    </div>

    <div class="flex items-center gap-3 ml-1.5 max-sm:ml-0 max-sm:w-full">
      <span class="max-sm:hidden">•</span>
      <p>{{ author() }}</p>
    </div>

    <div class="flex ml-auto max-sm:ml-0 max-sm:w-full max-sm:justify-end">
      <p>{{ createdAt() }}</p>
    </div>

  </div>
</div>
